apiVersion: batch/v1
kind: CronJob
metadata:
  name: enricher
  namespace: tendersbay-xyz
spec:
  # A third CronJob for the same reason `indexer` is a second one: work whose
  # pace is set by a slow external host must not share a deadline with work
  # that isn't. The enricher fetches one eForms XML document per TED notice,
  # paced at 250ms between download starts (TED rate-limits aggressively
  # above that), so a backlog measured in thousands of notices would consume
  # whichever window it was folded into — starving the other phase exactly the
  # way fetching once starved indexing (see ../readme.md).
  #
  # Runs four times an hour, offset by five minutes from the `indexer`'s
  # */15 fires and never landing on the hourly `ingestion` fire at :00, so the
  # three jobs never start into the same instant and contend for the same
  # database connections. The offset is a judgement call, not a house rule.
  schedule: "5,20,35,50 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # 840s = 14m, leaving headroom before the next fire. Like the indexer,
      # a deadline reached mid-drain is not data loss: each batch commits
      # independently and rows still holding xml_fetched_at IS NULL are simply
      # re-listed by the next run. The queue is the state.
      activeDeadlineSeconds: 840
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: tendersbay-xyz
            tier: ingestion-enricher
        spec:
          restartPolicy: OnFailure
          securityContext:
            # gcr.io/distroless/static-debian12:nonroot is UID/GID 65532.
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: enricher
              # Same image as ingestion, different binary — see the service
              # Dockerfile. The tag is rewritten by the shared Flux image
              # automation, which scans this whole folder (see update.yaml).
              image: bernardoforcillo/tendersbay-ingestion:20260810151335-93e752ecbf57bac0e21760798e780c825ebc9435@sha256:070ec0709dd6d76f2a2b3ec0db83c8efd549a74ff172008f3ea75aa12b44d0bf # {"$imagepolicy": "tendersbay-xyz:tendersbay-ingestion-image-policy"}
              command: ['/enricher']
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              # Matches the indexer's headroom. Each XML document is bounded at
              # 8 MiB by the fetcher and four are in flight at once, so the
              # steady-state working set is far below this — the ceiling exists
              # so a pathologically large notice fails as a single loud row
              # error rather than OOM-killing the pass. An estimate, not a
              # measured ceiling; revisit once the initial backlog has drained.
              resources:
                limits:
                  memory: '512Mi'
                  cpu: '500m'
                requests:
                  memory: '256Mi'
                  cpu: '100m'
              envFrom:
                - secretRef:
                    name: ingestion-secrets
              env:
                - name: SERVICE_NAME
                  value: 'tendersbay-enricher'
                # PostHog project key is a public client key (phc_…); plaintext is fine.
                - name: POSTHOG_API_KEY
                  value: 'phc_wDJgrzT5ar2CaE8LKuTVk35njTgJB4w2cTQyDQNzcD4C'
                - name: POSTHOG_HOST
                  value: 'https://eu.i.posthog.com'
                  # No QDRANT_URL / OLLAMA_BASE_URL / EMBEDDING_MODEL here: this
                  # job only fetches XML and persists the structure it parses out.
                  # It resets indexed_at on every row it enriches, so the embedding
                  # work it creates is done by the `indexer` CronJob, which owns
                  # those settings.
              imagePullPolicy: Always
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
