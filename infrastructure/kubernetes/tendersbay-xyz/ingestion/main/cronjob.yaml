apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingestion
  namespace: tendersbay-xyz
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      # 3000s = 50m, leaving headroom before the next hourly fire. Fixed
      # here (not an app env var) — see the design doc for why
      # INGESTION_TIMEOUT was dropped in favor of Kubernetes owning the cap.
      activeDeadlineSeconds: 3000
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: tendersbay-xyz
            tier: ingestion
        spec:
          restartPolicy: OnFailure
          securityContext:
            # gcr.io/distroless/static-debian12:nonroot is UID/GID 65532.
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: ingestion
              # Image published by .github/workflows/ci-ingestion.yml; tag
              # rewritten by Flux image automation once the first build
              # lands (see update.yaml). :latest is a bootstrap placeholder.
              image: bernardoforcillo/tendersbay-ingestion:20260728081340-59aa0f822bf66c49ae8ab3fa32f57c98b141406f@sha256:074203d5b523b9c1aff52189aff5cc1da57bcb35d2b675cfb8f4292c42912530 # {"$imagepolicy": "tendersbay-xyz:tendersbay-ingestion-image-policy"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              # This headroom was originally for PDF download+extraction, which
              # has since moved to the `indexer` CronJob — so it is now larger
              # than this job needs. Left as-is deliberately: lowering it is a
              # separate change that wants a measurement first, and getting it
              # wrong OOM-kills ingestion.
              resources:
                limits:
                  memory: '256Mi'
                  cpu: '200m'
                requests:
                  memory: '128Mi'
                  cpu: '50m'
              envFrom:
                - secretRef:
                    name: ingestion-secrets
              env:
                - name: SERVICE_NAME
                  value: 'tendersbay-ingestion'
                # PostHog project key is a public client key (phc_…); plaintext is fine.
                - name: POSTHOG_API_KEY
                  value: 'phc_wDJgrzT5ar2CaE8LKuTVk35njTgJB4w2cTQyDQNzcD4C'
                - name: POSTHOG_HOST
                  value: 'https://eu.i.posthog.com'
                # No QDRANT_URL / OLLAMA_BASE_URL / EMBEDDING_MODEL here: this
                # job only fetches and persists. Search indexing moved to the
                # `indexer` CronJob, which is where those belong now.
              imagePullPolicy: Always
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
