syntax = "proto3";
package tender.v1;

option go_package = "github.com/bernardoforcillo/tendersbay-xyz/services/backend/gen/tender/v1;tenderv1";

// TenderService serves the direct tender search endpoint behind the
// SearchDock's "Cerca" mode. Unlike AgentService, this is not a
// conversational tool — it's a structured request/response search, and
// SearchTenders is safe to call unauthenticated (anonymous callers get a
// lower result cap and a stricter rate limit; see the server-side config).
service TenderService {
  rpc SearchTenders(SearchTendersRequest) returns (SearchTendersResponse);
  rpc GetTender(GetTenderRequest) returns (GetTenderResponse);
  rpc GetRelatedTenders(GetRelatedTendersRequest) returns (GetRelatedTendersResponse);
  rpc ListTenderSitemap(ListTenderSitemapRequest) returns (ListTenderSitemapResponse);
  // Deterministic, membership-checked, unmetered per-client best-fit
  // shortlist — see tender.Service.RecommendForClient in the backend. Unlike
  // SearchTenders this requires authentication: it is scoped to one client
  // (workspace) and reads that client's ClientProfile.
  rpc RecommendTendersForClient(RecommendTendersForClientRequest) returns (RecommendTendersForClientResponse);
  // Which countries we currently hold tenders for (DISTINCT country over
  // ingested_tenders). Anonymous-safe like SearchTenders — the landing
  // coverage marquee reads it. "available" = we have >=1 tender for that
  // country (TED-inclusive), not a below-threshold-only claim.
  rpc GetCoverage(GetCoverageRequest) returns (GetCoverageResponse);
  // Passages of one tender's extracted documents around one question, together
  // with what we hold of that tender at all.
  //
  // Availability and passages are ONE answer and travel on one RPC by design.
  // Splitting them would eventually let a caller obtain passages without the
  // coverage that qualifies them, and an empty passage list with no cause
  // conflates "no passage matched your question" with "we hold nothing but the
  // notice PDF" — the exact conflation core/document exists to prevent.
  //
  // An empty question is valid and means "availability only": the server skips
  // retrieval entirely rather than paying for a query that cannot match. That
  // is what the public tender page's coverage strip calls.
  //
  // Authenticated, unlike the GetTender it sits beside: retrieval runs a
  // full-text query per call, which is a materially more expensive read than
  // serving an already-materialised notice, and the surface that consumes it is
  // behind auth anyway. The retrieval BOUND is a separate matter and is not
  // enforced at the transport: core/document clamps the passage count and each
  // passage's length itself, so no caller can widen a bound it does not own.
  rpc GetTenderPassages(GetTenderPassagesRequest) returns (GetTenderPassagesResponse);
}

message SearchTendersRequest {
  string query = 1;          // optional; empty = filters-only search
  TenderFilters filters = 2; // optional
  int32 limit = 3;           // optional, server-clamped by auth tier
  int32 offset = 4;          // optional, default 0. A query-driven search ranks
                              // within a bounded window of the top ~300 tenders;
                              // paging past it returns empty. A filters-only
                              // (empty query) search pages without that bound.
  string workspace_id = 5;   // optional; empty = today's anonymous-safe behavior
  // Optional result ordering: "relevance" (default), "deadline" (soonest
  // actionable first), "published" (newest first), "value" (largest first).
  // "relevance" is meaningless without a query and falls back to "published".
  string sort = 6;
  // ISO 639-1 language of the query text ("it", "de"). Intended to be taken
  // from the caller's UI locale (i18n.language's leading subtag) and used to
  // pick the stemming configuration for the keyword retriever, so the server
  // would ignore any value it has no configuration for rather than failing —
  // an unknown language is a client bug, and losing the whole search over it
  // would be a worse answer than an unstemmed match. Empty is valid and means
  // "match unstemmed only", which is every caller's behaviour today.
  //
  // Forward declaration: no caller populates this field yet, and nothing on
  // the server reads it. Phase 2 threads this into SearchParams.
  string language = 7;
  // CPV codes the client does not want inferred from this query.
  //
  // Removing an inferred code cannot be a purely client-side act: the server
  // resolves it from the same text on every request, so it would reappear on the
  // next page. The exclusion therefore travels with the request.
  //
  // Codes only, never a free-text exclusion: the value is compared against what
  // the lexicon resolved, so an unknown code is simply never matched and costs
  // nothing.
  repeated string suppressed_cpv = 8;
}

message TenderFilters {
  // country/cpv/status are the original single-value fields. They still work
  // and are OR-ed with their plural counterparts below, but new callers should
  // use the repeated fields — a real filter bar is multi-select.
  string country = 1 [deprecated = true]; // alpha-2, e.g. "IT", "DE"
  string cpv = 2 [deprecated = true];      // prefix match
  string status = 3 [deprecated = true];   // open/awarded/cancelled/closed/unknown
  string deadline_from = 4;                 // RFC3339
  string deadline_to = 5;                   // RFC3339

  // Values within one field are OR-ed; separate fields are AND-ed.
  repeated string countries = 6;      // alpha-2
  // Prefix match against a tender's primary CPV *or* any of its secondary
  // ones: "45" selects all of division 45.
  repeated string cpv_prefixes = 7;
  repeated string statuses = 8;
  repeated string nuts_prefixes = 9;  // "ITC" selects all of north-west Italy
  // Case-insensitive substring of the contracting authority's name — not a
  // prefix, since buyers are written inconsistently across sources.
  string buyer = 10;
  // Value bounds in MINOR units (cents), matching TenderResult.value — these
  // are compared against the stored value directly, so a client sending whole
  // units shifts the whole band by a factor of 100. optional, so that "no
  // lower bound" stays distinct from "at least zero".
  optional int64 value_min = 11;
  optional int64 value_max = 12;
}

message SearchTendersResponse {
  repeated TenderResult results = 1;
  bool has_more = 2; // server fetches limit+1 rows and trims, to avoid a
                      // separate COUNT(*) query
  // Which retrievers produced these results: "hybrid" (both), "lexical" or
  // "semantic" (one was unavailable), "filters" (no query — a date-ordered
  // browse, where relevance_score is meaningless). Reported so a degraded
  // search can be shown as degraded instead of quietly answering a different
  // question than the one asked.
  string retrieval_mode = 3;
  bool degraded = 4; // true when retrieval_mode is "lexical" or "semantic"
  // The filters the server actually applied, including any it lifted out of
  // the query text ("sotto 100k" becomes value_max). Returned so the UI can
  // show what it understood — and let the user undo it.
  TenderFilters applied_filters = 5;
  // The remaining query text after those constraints were lifted out. Empty
  // when the query was nothing but constraints.
  string applied_query = 6;
  // Counts per facet over the retrieved window, for filter-bar badges. These
  // describe the ranked window this request considered, NOT the whole corpus —
  // an exact global count would need a separate aggregate query per facet.
  repeated FacetCount country_facets = 7;
  repeated FacetCount status_facets = 8;
  repeated FacetCount cpv_division_facets = 9; // keyed by 2-digit CPV division
  // CPV codes the server inferred from the query text, with the label that
  // matched. Returned so the UI can show what was understood and let the user
  // remove it — the same reason applied_filters is returned.
  //
  // Unlike applied_filters these NARROWED nothing: the CPV signal is a ranking
  // boost, so a wrong match reorders the page rather than emptying it.
  repeated CpvMatch applied_cpv = 10;
  // Signals read out of the query text and applied as ranking boosts rather than
  // filters. Distinct from applied_filters precisely because they do not narrow
  // the result set: the UI offers to promote them to real filters, it does not
  // report them as already applied.
  //
  // Forward declaration: populated from a later phase (Phase 3); currently
  // always unset (nil), which is the correct wire representation of "nothing
  // inferred".
  InferredSignals inferred = 11;
}

message FacetCount {
  string value = 1;
  int32 count = 2;
}

// CpvMatch is one CPV code a query resolved to.
//
// A CPV code means the same thing in all 24 official EU languages, which is what
// makes it the bridge for cross-language search: a query in Italian resolves to a
// code that a German notice also carries.
message CpvMatch {
  string code = 1;     // 8 digits, no check digit
  string label = 2;    // the official label that matched, already localised data
  string language = 3; // ISO 639-1 of that label — may differ from the query's
  double score = 4;    // relative match strength; only the ordering is meaningful
}

// InferredSignals are constraints the server read out of the query text and
// applied as ranking boosts, NOT as filters.
//
// Kept separate from TenderFilters for exactly that reason: a filter narrows and
// can empty a page, a boost only reorders. The UI presents these as an offer
// ("only Germany") the user may promote to a real filter, never as something
// already applied.
//
// Forward declaration: no producer populates this message yet (Phase 3).
message InferredSignals {
  string country = 1;       // alpha-2; empty when no full country name was recognised
  string country_label = 2; // the name as it appeared in the query, for the chip
  string buyer = 3;         // buyer name matched by trigram; empty when none
}

message TenderResult {
  string id = 1;                // Postgres bigserial, stringified
  string title = 2;
  string buyer_name = 3;
  string status = 4;
  string procedure_type = 5;
  string country = 6;           // alpha-2, e.g. "IT", "DE"
  string cpv = 7;
  // MINOR units (cents), the scale ingestion stores: 629724005 is
  // €6,297,240.05, NOT €629,724,005. Divide by 100 to display.
  int64 value = 8;
  string currency = 9;
  string published_at = 10;     // RFC3339, empty if unset
  string deadline = 11;         // RFC3339, empty if unset
  double relevance_score = 12;  // meaningful only when query was non-empty; 0 for filters-only
  string source = 13;
  string source_ref = 14;
  string source_url = 15;       // the notice's document URL, empty if none is ingested
  string nuts = 16;             // NUTS region code, empty if unset
  string fit_tier = 17;         // "strong" | "possible" | "long_shot"; empty unless annotated
  ReasonSignals reason = 18;    // nil unless annotated
  string eu_threshold = 19;     // "below_eu" | "above_eu" | "" — coarse, buyer-agnostic
                                 // EU-threshold band (SME-winnable = below). Empty when
                                 // value is unknown OR the band is ambiguous. NOT value_fit.
  // A fragment of the matched text with the query terms marked by <mark>…</mark>,
  // so a result can show WHY it matched. Only the keyword retriever can produce
  // one, so it is empty for results found by vector search alone and for
  // filters-only browses.
  string snippet = 20;
}

message RecommendTendersForClientRequest {
  string workspace_id = 1;
  int32 limit = 2; // optional, server-defaulted
}

// ReasonSignals are the localizable FACTS behind a fit tier — never a
// prebuilt sentence. The frontend renders the sentence from these booleans/
// enums so every locale controls its own phrasing.
message ReasonSignals {
  bool sector_match = 1;
  bool country_match = 2;
  string value_fit = 3;    // "in_band" | "below" | "above" | "unknown"
  int32 deadline_days = 4; // meaningful only when has_deadline is true
  bool has_deadline = 5;
  bool region_match = 6;
  bool procedure_match = 7;
}

message RecommendedTenderResult {
  TenderResult tender = 1;
  string fit_tier = 2; // "strong" | "possible" | "long_shot"
  ReasonSignals reason = 3;
}

message RecommendTendersForClientResponse {
  repeated RecommendedTenderResult results = 1;
  bool needs_profile = 2; // true = no ClientProfile yet; results is empty
}

message GetCoverageRequest {}
message GetCoverageResponse {
  repeated string countries = 1; // alpha-2, uppercase; countries with >=1 ingested tender
}

message GetTenderRequest { string id = 1; }
message GetTenderResponse { TenderDetail tender = 1; }

message GetRelatedTendersRequest {
  string id = 1;
  int32 limit = 2; // optional, server-clamped
}
message GetRelatedTendersResponse { repeated TenderResult results = 1; }

message ListTenderSitemapRequest { int32 limit = 1; } // optional, server-clamped to <=50000
message ListTenderSitemapResponse { repeated TenderRef refs = 1; }

message TenderRef {
  string id = 1;
  string lastmod = 2; // RFC3339 (published_at), empty if unset
}

message TenderDocument {
  string url = 1;
  string type = 2;
}

message TenderLot {
  string ref = 1;
  string title = 2;
  string cpv = 3;
  // MINOR units (cents), as TenderResult.value.
  int64  value = 4;
  string currency = 5;
  string deadline = 6; // RFC3339, empty if unset
}

// AwardCriterion is one criterion of a notice's award grid, as published.
//
// weight is meaningful ONLY when weight_set. A zero weight and an absent weight
// are different published facts: notices routinely publish a lone entry naming
// the award method ("offerta economicamente più vantaggiosa") with nothing
// attached to it. Coalescing absent to 0 makes "criteria published" read as
// "grid recoverable", which overstates real coverage by roughly 2x on Italian
// notices — see core/tender.AwardCriterion.Weight.
message AwardCriterion {
  string lot_ref = 1;     // "" = notice-level, applies to every lot
  int32  ordinal = 2;     // position as published, within its lot_ref
  string type = 3;        // "quality" | "cost" | "price", as declared
  string name = 4;
  string description = 5;
  double weight = 6;
  bool   weight_set = 7;
  // weight_raw is the weight exactly as published ("30", "30%", "30,5"), so a
  // numeric parse failure loses comparability rather than the datum.
  string weight_raw = 8;
  // ISO 639-2/T ("ITA", "ENG"). Multilingual notices repeat every text field
  // once per language, so without it a reader cannot tell a deliberate language
  // choice from a parser accident.
  string lang = 9;
}

message TenderDetail {
  string id = 1;
  string title = 2;
  string buyer_name = 3;
  string buyer_id = 4;
  string status = 5;
  string procedure_type = 6;
  string country = 7;
  string nuts = 8;
  string language = 9;
  string cpv = 10;
  repeated string cpv_secondary = 11;
  // MINOR units (cents), as TenderResult.value.
  int64  value = 12;
  string currency = 13;
  string published_at = 14; // RFC3339, empty if unset
  string deadline = 15;     // RFC3339, empty if unset
  string source = 16;
  string source_ref = 17;
  string source_url = 18;   // best-effort; may be empty
  repeated TenderDocument documents = 19;
  repeated TenderLot lots = 20;

  // ── The eForms detail ───────────────────────────────────────────────────
  //
  // criteria holds the notice-level and every lot's criteria in ONE flat list
  // sorted by (lot_ref, ordinal); a criterion may name a lot that was never
  // ingested, so nesting them inside TenderLot would silently drop those.
  repeated AwardCriterion criteria = 21;
  // grid_usable is meaningful only when grid_usable_set. Unset is a THIRD state
  // — the notice's structured data was never read — and it is what lets a
  // reader tell "this notice publishes no usable grid" from "we have not looked
  // at this notice". A plain bool would record ignorance as a finding.
  bool   grid_usable = 22;
  bool   grid_usable_set = 23;
  // enriched_at is when the structured notice was successfully read; "" means
  // never, or read unsuccessfully. It carries the same distinction
  // grid_usable_set does and additionally dates the answer.
  string enriched_at = 24;   // RFC3339
  // documents_url is the buyer's own document page. It is the single actionable
  // affordance behind a body_not_retrieved coverage — we hold the link and not
  // what is behind it — so a coverage strip that could not offer it would be
  // telling the reader about a gap it gives them no way to close.
  string documents_url = 25;
}

// DocumentAvailability is what we hold of one tender's documents: the quantity
// and the CAUSE, which are orthogonal axes.
//
// notice_only because the buyer published nothing else and notice_only because
// we have not fetched what they did publish are the same quantity and opposite
// facts. The evidence counts travel with the answer so a consumer can audit it
// rather than trusting it — see core/document.Availability.Consistent, which is
// what makes "no_documents_published" defensible only while
// known_document_links is zero.
message DocumentAvailability {
  string coverage = 1;             // full | notice_only | none
  string reason = 2;               // "" | no_documents_published | notice_not_read |
                                    // body_not_retrieved | not_yet_extracted | extraction_failed
  bool   notice_read = 3;          // true only when the notice was read SUCCESSFULLY
  int32  known_document_links = 4; // buyer links we hold but have not retrieved
  int32  extracted_documents = 5;
  int32  extracted_parts = 6;
}

// DocumentCitation is where a quoted passage came from.
//
// Every field below document_url is optional, and that is a fact about the
// corpus rather than a modelling preference: page and section metadata are
// populated GOING FORWARD ONLY, so documents extracted before those columns
// existed carry none. A renderer must degrade all the way to the URL alone.
//
// page_start_set/page_end_set exist because page 0 and "we never learned the
// page" are both 0 on the wire, and rendering "p. 0" under a verbatim legal
// quote would undermine the one affordance this feature rests on. part_index is
// the exception that never degrades — it is the part's own key.
message DocumentCitation {
  string document_url = 1;
  string document_type = 2;   // "notice" | "spec" | "corrigendum" | ... — published label
  int32  part_index = 3;
  int32  page_start = 4;
  bool   page_start_set = 5;
  int32  page_end = 6;
  bool   page_end_set = 7;
  repeated string section_path = 8; // e.g. ["7", "7.2"]; empty when unknown
  string section_title = 9;
  bool   has_table = 10;
}

// Passage is one retrieved span of a tender document. text is already clamped
// server-side; truncated reports that it was, so a consumer can say "the passage
// continues" instead of presenting a sentence that stops mid-clause.
message Passage {
  string text = 1;
  bool   truncated = 2;
  double relevance_score = 3;
  DocumentCitation citation = 4;
}

message GetTenderPassagesRequest {
  string id = 1;
  // Empty is valid and means "availability only" — the server skips retrieval.
  string question = 2;
  // A hint the server may only NARROW. The real bound lives in core/document.
  int32  limit = 3;
}
message GetTenderPassagesResponse {
  DocumentAvailability availability = 1;
  repeated Passage passages = 2;
}
