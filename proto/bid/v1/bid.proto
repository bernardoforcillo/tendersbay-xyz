syntax = "proto3";
package bid.v1;

option go_package = "github.com/bernardoforcillo/tendersbay-xyz/services/backend/gen/bid/v1;bidv1";

import "tender/v1/tender.proto";

// BidService turns a found tender into a tracked bid inside a workbench and
// drives its lifecycle: go/no-go, sector-adapted ESPD checklist, forward-only
// stage stepper, terminal outcome. Every request carries workbench_id so the
// handler resolves access in one round trip.
service BidService {
  rpc AddBid(AddBidRequest) returns (AddBidResponse);
  rpc ListBids(ListBidsRequest) returns (ListBidsResponse);
  rpc GetBid(GetBidRequest) returns (GetBidResponse);
  rpc SetGoNoGo(SetGoNoGoRequest) returns (SetGoNoGoResponse);
  rpc AdvanceStage(AdvanceStageRequest) returns (AdvanceStageResponse);
  rpc RecordOutcome(RecordOutcomeRequest) returns (RecordOutcomeResponse);
  rpc ListChecklistItems(ListChecklistItemsRequest) returns (ListChecklistItemsResponse);
  rpc UpsertChecklistAnswer(UpsertChecklistAnswerRequest) returns (UpsertChecklistAnswerResponse);
  rpc RemoveBid(RemoveBidRequest) returns (RemoveBidResponse);

  // ESPD per-bid data: the lots tendered for (Part I), reliance on other
  // entities (Part II.C) and subcontractors (Part II.D). Reads follow
  // CanAccessWorkbench, writes CanManageWorkbench, like the checklist.
  rpc ListEspdData(ListEspdDataRequest) returns (ListEspdDataResponse);
  rpc PutLot(PutLotRequest) returns (PutLotResponse);
  rpc RemoveLot(RemoveLotRequest) returns (RemoveLotResponse);
  rpc PutSubcontractor(PutSubcontractorRequest) returns (PutSubcontractorResponse);
  rpc RemoveSubcontractor(RemoveSubcontractorRequest) returns (RemoveSubcontractorResponse);
  rpc PutReliance(PutRelianceRequest) returns (PutRelianceResponse);
  rpc RemoveReliance(RemoveRelianceRequest) returns (RemoveRelianceResponse);
}

message Bid {
  string id = 1;
  string workbench_id = 2;
  string tender_id = 3;            // stringified int64
  string go_no_go = 4;             // "undecided" | "go" | "no_go"
  string stage = 5;                // "shortlisted" | "preparing" | "submitted"
  string outcome = 6;              // "" | "won" | "lost" | "withdrawn"
  string created_at = 7;           // RFC3339
  string updated_at = 8;

  // Embedded tender summary (avoids N+1), populated from the batch summary port.
  bool   tender_available = 9;     // false => dangling; fields below empty
  string tender_title = 10;
  string tender_buyer_name = 11;
  string tender_country = 12;      // alpha-2
  string tender_cpv = 13;
  int64  tender_value = 14;
  string tender_currency = 15;
  string tender_deadline = 16;     // RFC3339, live from the tender (sort key)
  string tender_status = 17;

  // Fit (fresh) — spec §5.
  bool   needs_profile = 18;       // true => no client profile; fit_tier empty
  string fit_tier = 19;            // "strong" | "possible" | "long_shot" | ""
  tender.v1.ReasonSignals reason = 20;

  // Checklist progress for the portfolio card.
  int32  checklist_done = 21;
  int32  checklist_total = 22;

  // ── The decision record ─────────────────────────────────────────────────
  //
  // What the eligibility engine recommended at the moment this bid's go/no-go
  // was taken, carried on the wire so the client can report whether the human
  // agreed. Override rate is the number the whole scheda gara is measured by,
  // and it is not derivable from anything else here: the assessment is computed
  // fresh on every read, so re-running it later answers a different question
  // than "what did they decide against".
  //
  // "" means NO recommendation existed — the check could not be run at all —
  // which is a DIFFERENT fact from "insufficient_data" ("it ran, and the
  // evidence was too thin"). Collapsing the two would make the override rate
  // un-interpretable, so they stay distinguishable on the wire too.
  string decision_recommendation = 23;   // "" | insufficient_data | go | no_go
  // Whether the decision CONTRADICTS the recommendation. Derived server-side,
  // never taken from a caller. insufficient_data is deliberately never an
  // override: there was no opinion to contradict.
  bool   decision_overridden = 24;
  // How many blocking gaps stood at decision time — the SIZE of the
  // disagreement. Overriding a no_go resting on one lapsed certificate is a
  // different act from overriding one with four blocking gaps.
  int32  decision_blocking_gap_count = 25;
  // RFC3339; "" on a bid still undecided.
  string decision_recorded_at = 26;
}

message ChecklistItem {
  string id = 1;
  string section_code = 2;         // stable i18n stem, localized frontend-side
  string item_code = 3;
  string status = 4;               // "pending" | "done" | "na"
  string note = 5;
  bool   required = 6;
  int32  position = 7;
}

message AddBidRequest { string workbench_id = 1; string tender_id = 2; }
message AddBidResponse { Bid bid = 1; }

message ListBidsRequest { string workbench_id = 1; }
message ListBidsResponse { repeated Bid bids = 1; }

message GetBidRequest { string workbench_id = 1; string bid_id = 2; }
message GetBidResponse { Bid bid = 1; }

message SetGoNoGoRequest { string workbench_id = 1; string bid_id = 2; string go_no_go = 3; }
message SetGoNoGoResponse { Bid bid = 1; }

message AdvanceStageRequest { string workbench_id = 1; string bid_id = 2; }
message AdvanceStageResponse { Bid bid = 1; }

message RecordOutcomeRequest { string workbench_id = 1; string bid_id = 2; string outcome = 3; }
message RecordOutcomeResponse { Bid bid = 1; }

message ListChecklistItemsRequest { string workbench_id = 1; string bid_id = 2; }
message ListChecklistItemsResponse { repeated ChecklistItem items = 1; }

message UpsertChecklistAnswerRequest {
  string workbench_id = 1;
  string bid_id = 2;
  string item_code = 3;
  string status = 4;
  string note = 5;
}
message UpsertChecklistAnswerResponse { ChecklistItem item = 1; }

message RemoveBidRequest { string workbench_id = 1; string bid_id = 2; }
message RemoveBidResponse {}

// ── ESPD per-bid data ─────────────────────────────────────────────────────
//
// No provenance here: these are the operator's choices for this gara, not
// facts a buyer can demand a certificate for. Upsert keys: lot on lot_ref,
// subcontractor on vat, reliance on (vat, criterion).

message Lot {
  string id = 1;
  string lot_ref = 2;              // the buyer's lot id as published ("LOT-0001", "1", "A")
  int32  position = 3;             // display order
}

message Subcontractor {
  string id = 1;
  string name = 2;
  string vat = 3;
  string country = 4;              // alpha-2, "" = unstated
  int32  share_pct = 5;            // meaningful only if share_pct_set
  bool   share_pct_set = 6;
}

message Reliance {
  string id = 1;
  string entity_name = 2;
  string vat = 3;
  string criterion = 4;            // the espd criterion key relied on, e.g. "iv.b.general_yearly_turnover"
}

message ListEspdDataRequest { string workbench_id = 1; string bid_id = 2; }
message ListEspdDataResponse {
  repeated Lot lots = 1;
  repeated Subcontractor subcontractors = 2;
  repeated Reliance reliances = 3;
}

message PutLotRequest { string workbench_id = 1; string bid_id = 2; Lot lot = 3; }
message PutLotResponse { Lot lot = 1; }
message RemoveLotRequest { string workbench_id = 1; string bid_id = 2; string id = 3; }
message RemoveLotResponse {}

message PutSubcontractorRequest { string workbench_id = 1; string bid_id = 2; Subcontractor subcontractor = 3; }
message PutSubcontractorResponse { Subcontractor subcontractor = 1; }
message RemoveSubcontractorRequest { string workbench_id = 1; string bid_id = 2; string id = 3; }
message RemoveSubcontractorResponse {}

message PutRelianceRequest { string workbench_id = 1; string bid_id = 2; Reliance reliance = 3; }
message PutRelianceResponse { Reliance reliance = 1; }
message RemoveRelianceRequest { string workbench_id = 1; string bid_id = 2; string id = 3; }
message RemoveRelianceResponse {}
