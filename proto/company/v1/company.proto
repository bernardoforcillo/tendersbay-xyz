syntax = "proto3";
package company.v1;

option go_package = "github.com/bernardoforcillo/tendersbay-xyz/services/backend/gen/company/v1;companyv1";

// CompanyService owns the company dossier — the facts about the operator ITSELF
// (registry identity, SOA attestations, certifications, esercizi, referenze,
// iscrizioni) — and the eligibility question those facts answer: "may we
// lawfully be admitted to this gara at all".
//
// It is a service of its own and not more RPCs on WorkspaceService, for two
// reasons. WorkspaceService already carries 30+ RPCs of workspace/members/roles/
// invites, and folding fourteen dossier RPCs into it is the same "one slice
// absorbing unrelated concerns" smell the domain split rejects for
// clientprofile. And a separate file gives the frontend a separate generated
// module, so the tenders page does not pull the dossier bundle.
//
// Wire conventions here are copied from bid.proto and workspace.proto
// deliberately, against instinct:
//
//   - int64 ids travel as strings;
//   - money travels as int64 minor units;
//   - timestamps travel as RFC3339 strings;
//   - enums travel as strings with the values listed in a comment, NOT as proto
//     enums — it keeps the domain constants byte-identical on the wire and stops
//     a constant rename from being a wire break;
//   - an optional scalar is a value plus a paired `_set` bool, not proto3
//     `optional` (workspace.proto's value_min/value_min_set is the house idiom).
service CompanyService {
  // Dossier
  rpc GetCompanyDossier(GetCompanyDossierRequest) returns (GetCompanyDossierResponse);
  rpc UpdateCompanyIdentity(UpdateCompanyIdentityRequest) returns (UpdateCompanyIdentityResponse);
  rpc PutSoaCategory(PutSoaCategoryRequest) returns (PutSoaCategoryResponse);
  rpc RemoveSoaCategory(RemoveSoaCategoryRequest) returns (RemoveSoaCategoryResponse);
  rpc PutCertification(PutCertificationRequest) returns (PutCertificationResponse);
  rpc RemoveCertification(RemoveCertificationRequest) returns (RemoveCertificationResponse);
  rpc PutFinancialYear(PutFinancialYearRequest) returns (PutFinancialYearResponse);
  rpc RemoveFinancialYear(RemoveFinancialYearRequest) returns (RemoveFinancialYearResponse);
  rpc PutPastContract(PutPastContractRequest) returns (PutPastContractResponse);
  rpc RemovePastContract(RemovePastContractRequest) returns (RemovePastContractResponse);
  rpc PutRegistration(PutRegistrationRequest) returns (PutRegistrationResponse);
  rpc RemoveRegistration(RemoveRegistrationRequest) returns (RemoveRegistrationResponse);

  // ESPD/DGUE sections: who signs (Part II.B) and what the operator declares
  // about the exclusion grounds (Part III). Same write rule as the rest of the
  // dossier (PermManageWorkspace), plus one the server enforces on its own:
  // a declaration is always recorded as user_stated — there is no way to
  // import or infer one.
  rpc PutRepresentative(PutRepresentativeRequest) returns (PutRepresentativeResponse);
  rpc RemoveRepresentative(RemoveRepresentativeRequest) returns (RemoveRepresentativeResponse);
  rpc PutDeclaration(PutDeclarationRequest) returns (PutDeclarationResponse);
  rpc RemoveDeclaration(RemoveDeclarationRequest) returns (RemoveDeclarationResponse);
  rpc PutNationalGround(PutNationalGroundRequest) returns (PutNationalGroundResponse);
  rpc RemoveNationalGround(RemoveNationalGroundRequest) returns (RemoveNationalGroundResponse);

  // Eligibility
  rpc CheckEligibility(CheckEligibilityRequest) returns (CheckEligibilityResponse);
  rpc ListTenderRequirements(ListTenderRequirementsRequest) returns (ListTenderRequirementsResponse);
  rpc ConfirmTenderRequirement(ConfirmTenderRequirementRequest) returns (ConfirmTenderRequirementResponse);
  rpc RemoveTenderRequirement(RemoveTenderRequirementRequest) returns (RemoveTenderRequirementResponse);
}

// Attribution travels with every record so the UI can render "you typed this"
// versus "the agent asked and you confirmed" — the whole reason provenance
// exists. It is READ-mostly: on a write the server derives provenance,
// stated_by and stated_at from how the call arrived and ignores whatever the
// client sent for them, so a caller has no lever with which to forge a stronger
// claim than the one it actually made. Only source_note, prompted_by and
// prompted_by_tender_id are carried through from a request.
message Attribution {
  string provenance = 1;              // user_stated | user_confirmed | agent_inferred | imported
  double confidence = 2;              // meaningful only if confidence_set
  bool   confidence_set = 3;
  string stated_by = 4;               // user id; "" when no human was involved
  string stated_at = 5;               // RFC3339
  string prompted_by = 6;             // tender | onboarding | extraction
  string prompted_by_tender_id = 7;   // stringified int64; "" = none
  string source_note = 8;
}

// CompanyIdentity is the registry identity a DGUE Part II reads straight off.
//
// vat_number and fiscal_code are two fields and not one because for an Italian
// company they usually coincide (11 digits) and for a ditta individuale they do
// not (16-character codice fiscale, 11-digit partita IVA).
message CompanyIdentity {
  string legal_name = 1;
  string vat_number = 2;              // partita IVA
  string fiscal_code = 3;             // codice fiscale
  string legal_form = 4;              // srl | srls | spa | sapa | sas | snc | ditta_individuale |
                                      // cooperativa | consorzio | societa_semplice | ente_pubblico | other
  string cciaa_office = 5;            // provincia sigla, e.g. "MI"
  string cciaa_number = 6;            // numero REA
  string country = 7;                 // alpha-2
  string nuts = 8;                    // uppercase NUTS code of the legal seat
  int32  founded_year = 9;            // meaningful only if founded_year_set
  bool   founded_year_set = 10;
  // attribution is per-field, keyed by the identity field name: legal_name |
  // vat_number | fiscal_code | legal_form | cciaa | country | nuts |
  // founded_year | is_sme. A field with NO entry has never been asserted by
  // anyone, which is a different state from an empty string a human
  // deliberately cleared — so a missing key must not be rendered as "unknown
  // provenance".
  map<string, Attribution> attribution = 11;
  // is_sme is the operator's SME self-classification (DGUE Part II.A). It is
  // asked, never derived from headcount and turnover: the EU definition also
  // counts linked and partner enterprises the dossier knows nothing about.
  // Whether it was ever answered is attribution["is_sme"], not the bool.
  bool   is_sme = 12;
}

// Representative is one natural person entitled to represent the operator
// (DGUE Part II.B). Personal data of a third party: never enters analytics.
message Representative {
  string id = 1;
  string role = 2;                    // legale_rappresentante | procuratore | direttore_tecnico | free text
  string given_name = 3;
  string family_name = 4;
  string birth_date = 5;              // RFC3339, "" = unstated
  string birth_place = 6;
  string address = 7;
  string email = 8;
  bool   power_of_attorney = 9;       // acts under a procura rather than by office
  Attribution attribution = 10;
}

// Declaration is the operator's answer to ONE Part III.A–C exclusion-ground
// question. answer=true means the ground APPLIES; self_cleaning then carries
// the Art. 57(6) measures. The server records it as user_stated whatever the
// request says — a Part III answer cannot be imported or inferred.
message Declaration {
  string id = 1;
  string criterion = 2;               // stable key, e.g. "iii.a.fraud" — see espd.v1
  bool   answer = 3;
  string self_cleaning = 4;
  Attribution attribution = 5;
}

// NationalGround is a Part III.D answer: a purely national exclusion ground,
// per Member State and per criterion.
message NationalGround {
  string id = 1;
  string country = 2;                 // alpha-2
  string criterion = 3;               // national code, e.g. "art94.c1"
  bool   answer = 4;
  string note = 5;
  Attribution attribution = 6;
}

// SoaCategory is one attestazione SOA line.
message SoaCategory {
  string id = 1;
  string category = 2;                // OG1..OG13 | OS1..OS35
  string classifica = 3;              // "I".."VIII", incl. "III-bis", "IV-bis"
  string issued_by = 4;
  string valid_until = 5;             // RFC3339, "" = unknown
  // verified_until is the TRIENNIAL verification deadline, which lapses three
  // years before valid_until and invalidates the attestation on its own. A
  // client that showed only valid_until would report a lapsed attestation as
  // valid for two more years.
  string verified_until = 6;          // RFC3339, "" = unknown
  Attribution attribution = 7;
}

message Certification {
  string id = 1;
  string standard = 2;                // iso_9001 | iso_14001 | iso_45001 | iso_27001 | iso_37001 |
                                      // iso_50001 | sa_8000 | uni_pdr_125 | iso_20121 | emas | other
  string standard_raw = 3;            // the published name when standard == "other"
  string scope = 4;                   // certified scope / IAF sector — a certificate is scope-bounded
  string issued_by = 5;
  string valid_from = 6;              // RFC3339
  string valid_until = 7;             // RFC3339
  Attribution attribution = 8;
}

// FinancialYear carries turnover AND headcount together because Italian
// selection criteria ask for both per esercizio ("fatturato globale degli
// ultimi tre esercizi", "organico medio annuo del triennio").
message FinancialYear {
  int32  year = 1;
  int64  turnover_minor = 2;          // fatturato globale; meaningful only if turnover_set
  bool   turnover_set = 3;
  int64  specific_turnover_minor = 4; // fatturato nel settore; meaningful only if specific_turnover_set
  bool   specific_turnover_set = 5;
  string currency = 6;                // ISO-4217
  int32  headcount = 7;               // meaningful only if headcount_set
  bool   headcount_set = 8;
  Attribution attribution = 9;
}

message PastContract {
  string id = 1;
  string description = 2;
  string buyer_name = 3;
  string cpv = 4;
  int64  value_minor = 5;             // meaningful only if value_set
  bool   value_set = 6;
  string currency = 7;
  string started_on = 8;              // RFC3339
  string ended_on = 9;                // RFC3339
  string role = 10;                   // principal | subcontractor | rti_mandataria | rti_mandante
  // share_pct is the company's own share when role is a shared one. It is what
  // actually counts toward a requirement — a 20% mandante on a €5M contract
  // carries €1M of reference, not €5M.
  double share_pct = 11;              // meaningful only if share_pct_set
  bool   share_pct_set = 12;
  Attribution attribution = 13;
}

message Registration {
  string id = 1;
  string kind = 2;                    // white_list | cciaa | albo_gestori_ambientali | mepa |
                                      // sistema_qualificazione | albo_professionale | anac | other
  string authority = 3;               // "Prefettura di Milano"
  string identifier = 4;              // registration number — never enters analytics
  string section = 5;                 // white-list activity section / albo category
  string valid_from = 6;              // RFC3339
  string valid_until = 7;             // RFC3339
  Attribution attribution = 8;
}

// CompanyDossier is the whole company, one per workspace. There is deliberately
// no company id: the workspace IS the company, exactly as it IS the client for
// the client profile.
message CompanyDossier {
  string workspace_id = 1;
  CompanyIdentity identity = 2;
  repeated SoaCategory soa = 3;
  repeated Certification certifications = 4;
  repeated FinancialYear financial_years = 5;  // newest first
  repeated PastContract past_contracts = 6;
  repeated Registration registrations = 7;
  string updated_at = 8;              // RFC3339
  repeated Representative representatives = 9;
  repeated Declaration declarations = 10;
  repeated NationalGround national_grounds = 11;
}

// TenderRequirement is one participation requirement captured for one tender by
// one workspace. It is workspace-scoped and not corpus-shared: one workspace's
// mis-extraction must not decide another workspace's go/no-go.
message TenderRequirement {
  string id = 1;
  string tender_id = 2;               // stringified int64
  string lot_ref = 3;                 // "" = notice-level, applies to every lot
  string kind = 4;                    // soa | certification | turnover | past_contracts |
                                      // headcount | registration | other
  string requirement_text = 5;        // as published — what a human checks the parse against
  // blocking distinguishes a requisito di partecipazione from a criterio
  // premiante. It defaults to true on capture: an unclassified requirement
  // treated as blocking produces a question, treated as non-blocking produces a
  // silent pass.
  bool   blocking = 6;
  string source = 7;                  // user_stated | document_excerpt | award_criteria | agent_inferred
  string excerpt = 8;                 // the quoted passage; "" for user_stated
  string document_url = 9;            // where the quote came from
  string page = 10;                   // "14" or "14-16"; "" when unknown
  string section = 11;                // "7.2 Requisiti di capacità tecnica"
  // confirmed_by is the user who checked the extraction against the quoted
  // passage. "" = unconfirmed, and an unconfirmed extraction can raise a
  // QUESTION but never a verdict.
  string confirmed_by = 12;
  string confirmed_at = 13;           // RFC3339
}

// EligibilityGap is one requirement checked against the dossier. `held` is what
// the dossier actually says, carried so a client leads with the FACT
// ("richiede SOA OG1 III; il profilo indica OG1 I") rather than with a verdict.
message EligibilityGap {
  TenderRequirement requirement = 1;
  // status: met | missing | shortfall | expiring | expired | unknown.
  // "unknown" is NOT "missing": missing means we asked and the answer was no,
  // unknown means we never asked — and it is the just-in-time capture trigger.
  string status = 2;
  bool   blocking = 3;
  string held = 4;
  string remedy = 5;                  // "" | provide_fact | renew | upgrade | avvalimento | rti | subcontract
  string question = 6;                // set iff status == "unknown"
  repeated string question_options = 7;
}

// EligibilityAssessment is one tender × dossier evaluation, computed fresh on
// every read and never persisted.
//
// gaps is field 2 and verdict is field 8, deliberately. Field order is the
// reading order in generated docs and in JSON, and the product rule is that the
// blocking FACT leads and the verdict follows.
message EligibilityAssessment {
  string tender_id = 1;               // stringified int64
  repeated EligibilityGap gaps = 2;
  int32  requirement_count = 3;
  int32  authoritative_requirement_count = 4;
  int32  blocking_gap_count = 5;
  int32  unknown_gap_count = 6;
  string document_coverage = 7;       // full | notice_only | none
  string verdict = 8;                 // insufficient_data | go | no_go
  string document_reason = 9;         // "" | no_documents_published | notice_not_read |
                                      // body_not_retrieved | not_yet_extracted | extraction_failed
  string lot_ref = 10;
  string evaluated_at = 11;           // RFC3339
  // caveats are machine-readable honesty flags about the EVIDENCE the verdict
  // rests on, in a fixed order: no_requirements_captured | award_grid_only |
  // unconfirmed_extraction | open_questions | documents_unread.
  //
  // They are not decoration on the verdict, they are the qualification that
  // makes it honest. A verdict computed with no document coverage at all and
  // rendered with nothing beside it reads as a clean bill of health; silence
  // about what was not checked is how ignorance gets read as a finding. They
  // are also what lets an "insufficient_data because we read nothing" be told
  // apart from an "insufficient_data because the user has not answered yet".
  repeated string caveats = 12;
}

// ── Dossier ─────────────────────────────────────────────────────────────────

message GetCompanyDossierRequest { string workspace_id = 1; }
// exists is false when nothing has ever been asserted about this company. It is
// a separate field rather than a null dossier because "we hold nothing" is a
// state the UI renders differently from "we hold an empty identity".
message GetCompanyDossierResponse { CompanyDossier dossier = 1; bool exists = 2; }

// UpdateCompanyIdentityRequest full-replaces the identity scalars: a cleared
// field overwrites the stored value rather than leaving it standing. The server
// re-stamps provenance for the fields this edit actually changed.
message UpdateCompanyIdentityRequest {
  string workspace_id = 1;
  CompanyIdentity identity = 2;
  // attribution carries only the CONTEXT of the edit — why we asked, which gara
  // prompted it, a short human-readable trace. Its provenance/stated_by/
  // stated_at are ignored and derived server-side.
  Attribution attribution = 3;
}
message UpdateCompanyIdentityResponse { CompanyIdentity identity = 1; }

message PutSoaCategoryRequest { string workspace_id = 1; SoaCategory soa = 2; }
message PutSoaCategoryResponse { SoaCategory soa = 1; }
message RemoveSoaCategoryRequest { string workspace_id = 1; string id = 2; }
message RemoveSoaCategoryResponse {}

message PutCertificationRequest { string workspace_id = 1; Certification certification = 2; }
message PutCertificationResponse { Certification certification = 1; }
message RemoveCertificationRequest { string workspace_id = 1; string id = 2; }
message RemoveCertificationResponse {}

message PutFinancialYearRequest { string workspace_id = 1; FinancialYear financial_year = 2; }
message PutFinancialYearResponse { FinancialYear financial_year = 1; }
// Keyed by year and not by an id, for the same reason the row is: the year IS
// the identity of the record.
message RemoveFinancialYearRequest { string workspace_id = 1; int32 year = 2; }
message RemoveFinancialYearResponse {}

message PutPastContractRequest { string workspace_id = 1; PastContract past_contract = 2; }
message PutPastContractResponse { PastContract past_contract = 1; }
message RemovePastContractRequest { string workspace_id = 1; string id = 2; }
message RemovePastContractResponse {}

message PutRegistrationRequest { string workspace_id = 1; Registration registration = 2; }
message PutRegistrationResponse { Registration registration = 1; }
message RemoveRegistrationRequest { string workspace_id = 1; string id = 2; }
message RemoveRegistrationResponse {}

message PutRepresentativeRequest { string workspace_id = 1; Representative representative = 2; }
message PutRepresentativeResponse { Representative representative = 1; }
message RemoveRepresentativeRequest { string workspace_id = 1; string id = 2; }
message RemoveRepresentativeResponse {}

message PutDeclarationRequest { string workspace_id = 1; Declaration declaration = 2; }
message PutDeclarationResponse { Declaration declaration = 1; }
message RemoveDeclarationRequest { string workspace_id = 1; string id = 2; }
message RemoveDeclarationResponse {}

message PutNationalGroundRequest { string workspace_id = 1; NationalGround national_ground = 2; }
message PutNationalGroundResponse { NationalGround national_ground = 1; }
message RemoveNationalGroundRequest { string workspace_id = 1; string id = 2; }
message RemoveNationalGroundResponse {}

// ── Eligibility ─────────────────────────────────────────────────────────────

message CheckEligibilityRequest  { string workspace_id = 1; string tender_id = 2; string lot_ref = 3; }
message CheckEligibilityResponse { EligibilityAssessment assessment = 1; }

message ListTenderRequirementsRequest  { string workspace_id = 1; string tender_id = 2; }
message ListTenderRequirementsResponse { repeated TenderRequirement requirements = 1; }

message ConfirmTenderRequirementRequest  { string workspace_id = 1; string requirement_id = 2; }
message ConfirmTenderRequirementResponse { TenderRequirement requirement = 1; }

message RemoveTenderRequirementRequest  { string workspace_id = 1; string requirement_id = 2; }
message RemoveTenderRequirementResponse {}
