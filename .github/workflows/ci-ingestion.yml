name: ci-ingestion

on:
  pull_request:
  push:
    branches: [main, dev]
    paths:
      - 'services/ingestion/**'
      - 'go-services/**'
      - 'go.work'
      - 'go.work.sum'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.nvmrc'
      - '.github/workflows/ci-ingestion.yml'

jobs:
  quality:
    runs-on: ubuntu-latest

    # A real PostgreSQL, so the database-backed tests run here rather than
    # skip on the missing TEST_DATABASE_URL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tendersbay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tendersbay_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint + test (Go via Turbo)
        run: pnpm exec turbo run lint test --filter ingestion

  docker:
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/tendersbay-ingestion"
          STAMP="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAGS="${REPO}:${STAMP},${REPO}:latest"
          else
            TAGS="${REPO}:${STAMP}-canary"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/ingestion/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
