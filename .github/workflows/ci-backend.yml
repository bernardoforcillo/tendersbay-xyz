name: ci-backend

on:
  pull_request:
  push:
    branches: [main, dev]
    paths:
      - 'services/backend/**'
      - 'go-services/**'
      - 'go.work'
      - 'go.work.sum'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.nvmrc'
      - '.github/workflows/ci-backend.yml'

jobs:
  quality:
    runs-on: ubuntu-latest

    # A real PostgreSQL, so the database-backed tests RUN here rather than
    # skip. Without it every test gated on TEST_DATABASE_URL — the store
    # contracts, the legacy-data migration run, the e2e journeys — passes
    # trivially, and CI is green over a suite that never executed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tendersbay_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The shared database the suite seeds rows into.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tendersbay_test?sslmode=disable
      # A SCRATCH database: the authlayer store contracts truncate users (which
      # cascades to nearly everything) and the migration test drops the public
      # schema. Deliberately not the same database as above.
      TEST_AUTH_CONTRACT_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tendersbay_contract?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create the scratch database
        run: psql "postgres://postgres:postgres@localhost:5432/postgres" -c 'CREATE DATABASE tendersbay_contract'

      # The tenders schema this service's search, document, detail and eForms
      # repositories read is owned and migrated by services/ingestion. Pointing
      # that service's migrator at the same database once is what makes those
      # tests run instead of skip; the CPV vocabulary is embedded in the seeder,
      # so no network is needed. See CLAUDE.md, "BOTH migration chains".
      - name: Migrate the ingestion schema and seed the CPV vocabulary
        working-directory: services/ingestion
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          go test ./internal/adapter/postgres/ -run '^TestNew$' -count=1
          go run ./cmd/seed-cpv

      - name: Lint + test (Go via Turbo)
        run: pnpm exec turbo run lint test --filter backend

  docker:
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/tendersbay-backend"
          STAMP="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAGS="${REPO}:${STAMP},${REPO}:latest"
          else
            TAGS="${REPO}:${STAMP}-canary"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/backend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
